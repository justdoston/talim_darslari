<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Access — Cyber Pedia</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0d10;
      --panel: rgba(255, 255, 255, 0.06);
      --text: #e6e6eb;
      --muted: #9aa0aa;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #4f8cff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #12151c, var(--bg));
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px;
      backdrop-filter: blur(14px);
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }

    input::placeholder {
      color: var(--muted);
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .note {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>Restricted Access</h1>
    <p>Slow and Steady</p>

    <input type="text" placeholder="Username" disabled />
    <input type="password" placeholder="Password" disabled />

    <button>Login (disabled)</button>

    <div class="note">
      Authentication is not enabled yet.
    </div>
  </div>

</body>
</html>
